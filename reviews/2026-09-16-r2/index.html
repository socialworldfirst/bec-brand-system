<style>
:root{--red:#FF0051;--dark:#13002D;--purple:#32006E;--grey:#484F56;--lgrey:#ECEDEE;--white:#fff;--yellow:#FFE41E;--green:#0F9D58}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,sans-serif;color:var(--dark);background:var(--lgrey)}
.wrap{max-width:1232px;margin:0 auto;padding:0 24px 96px}
header{background:var(--dark);color:#fff;padding:52px 0 44px;margin-bottom:40px}
header .wrap{padding-bottom:0}
h1{font-weight:800;letter-spacing:-3px;font-size:54px;margin:0 0 10px;line-height:1.05}
.sub{font-size:18px;color:#cfc7d6;margin:0}
.verdict{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:13px;letter-spacing:2px;padding:9px 20px;border-radius:999px;margin-bottom:20px}
h2{font-weight:800;letter-spacing:-1px;font-size:33px;margin:58px 0 6px}
h3{font-weight:700;font-size:20px;margin:38px 0 12px}
.meta{color:var(--grey);font-size:15px;margin:0 0 22px}
.shot{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 18px rgba(19,0,45,.09)}
.shot img{width:100%;display:block;border-radius:9px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 18px rgba(19,0,45,.09);margin:22px 0}
th{background:var(--dark);color:#fff;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;text-align:left;padding:14px 16px}
td{padding:15px 16px;border-top:1px solid var(--lgrey);font-size:15px;vertical-align:top;line-height:1.55}
td.n{width:44px;text-align:center}
.pin{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:15px}
.sev{display:inline-block;font-weight:700;font-size:11px;letter-spacing:1px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.block{background:var(--red);color:#fff}.advise{background:var(--yellow);color:var(--dark)}.pass{background:var(--green);color:#fff}
a{color:var(--red)}
code,.rule{background:var(--lgrey);padding:2px 7px;border-radius:5px;font-size:13px;font-family:ui-monospace,SFMono-Regular,monospace;text-decoration:none;color:var(--dark);font-weight:600}
a.rule:hover{background:var(--red);color:#fff}
.tile{display:inline-block;background:var(--dark);color:#fff;font-size:12px;font-weight:600;letter-spacing:.4px;padding:5px 12px;border-radius:999px;text-decoration:none;margin-top:8px}
.tile:hover{background:var(--red)}
.sw{display:inline-block;width:15px;height:15px;border-radius:4px;vertical-align:-3px;margin-right:6px;border:1px solid rgba(0,0,0,.18)}
.ev{background:#fff;border-radius:16px;padding:22px;margin:20px 0;box-shadow:0 2px 18px rgba(19,0,45,.09)}
.ev h4{margin:0 0 4px;font-size:16px;font-weight:700}
.ev p{margin:0 0 16px;color:var(--grey);font-size:14px;line-height:1.6}
.ev img{width:100%;display:block;border-radius:9px;border:1px solid var(--lgrey)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cap{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--grey);margin:0 0 8px}
.bad .cap{color:var(--red)}.good .cap{color:var(--green)}
.pl{border-left:4px solid var(--red);padding-left:16px;margin:24px 0}
.pl.ok{border-color:var(--green)}
ul{margin:10px 0 0;padding-left:20px;font-size:15px;line-height:1.75}
.note{background:#fff;border-left:4px solid var(--red);border-radius:0 12px 12px 0;padding:18px 22px;font-size:15px;line-height:1.65;margin:26px 0}
.note.ok{border-left-color:var(--green)}
.stat{display:flex;gap:40px;flex-wrap:wrap;margin:26px 0 8px}
.stat div b{display:block;font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat div span{font-size:13px;color:var(--grey);letter-spacing:.4px}
.st{font-weight:700;font-size:11px;letter-spacing:1px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.fixed{background:var(--green);color:#fff}.open{background:var(--red);color:#fff}
@media(max-width:820px){.two{grid-template-columns:1fr}h1{font-size:34px;letter-spacing:-1px}}
</style>

<script>
(function(){
  var KEY='gate:'+location.pathname;
  function b2b(b64){var s=atob(b64),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function derive(pw,salt,it){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
      'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,
      hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function decrypt(pw){
    var b=JSON.parse(document.getElementById('gate-payload').textContent);
    var k=await derive(pw,b2b(b.salt),b.iterations);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(b.iv)},k,
      b2b(b.ciphertext));
    return new TextDecoder().decode(plain);
  }
  function runScripts(root){
    root.querySelectorAll('script').forEach(function(old){
      var s=document.createElement('script');
      for(var i=0;i<old.attributes.length;i++){
        s.setAttribute(old.attributes[i].name,old.attributes[i].value);
      }
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  }
  function reveal(html){
    var c=document.getElementById('gate-content');
    c.innerHTML=html; c.hidden=false;
    var g=document.getElementById('gate'); if(g) g.remove();
    document.body.classList.remove('gate-locked');
    runScripts(c);
    var lock=document.createElement('div');
    lock.className='gate-lock'; lock.textContent='lock device';
    lock.onclick=function(){localStorage.removeItem(KEY);location.reload();};
    document.body.appendChild(lock);
    window.dispatchEvent(new Event('gate:unlocked'));
    try{window.dispatchEvent(new Event('resize'));}catch(e){}
  }
  window.gateSubmit=async function(e){
    e.preventDefault();
    var inp=document.getElementById('gate-input');
    var err=document.getElementById('gate-err');
    err.textContent='';
    try{
      var html=await decrypt(inp.value);
      localStorage.setItem(KEY,inp.value);
      reveal(html);
    }catch(_){ err.textContent='Wrong password.'; inp.select(); }
    return false;
  };
  document.addEventListener('DOMContentLoaded',async function(){
    var saved=localStorage.getItem(KEY);
    if(!saved) return;
    try{ reveal(await decrypt(saved)); }
    catch(_){ localStorage.removeItem(KEY); }
  });
})();
</script>
